# Workflow для ПУБЛИЧНОГО репозитория novruzluturqut-maker/way-models (положить в .github/workflows/way-models.yml).
# Качает GGUF с Hugging Face (нужен секрет HF_TOKEN — Read-токен) и выкладывает их как Release `v1` этого репозитория:
# телефон потом скачивает по https://github.com/novruzluturqut-maker/way-models/releases/download/v1/<файл> без всяких токенов.
# Лимит GitHub на файл релиза — 2 ГиБ, поэтому берём квантизации ≤ 2 ГБ.
name: WaY models
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза"
        default: "v1"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Скачать модели с Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e; mkdir -p out; cd out
          test -n "$HF_TOKEN" || { echo "::error::нет секрета HF_TOKEN"; exit 1; }
          dl() { # url имя
            echo "== $2"; curl -sSL --fail --retry 3 -H "Authorization: Bearer $HF_TOKEN" -o "$2" "$1"
            head -c 4 "$2" | grep -q GGUF || { echo "::error::$2 — не GGUF (ответ сервера?)"; head -c 300 "$2"; exit 1; }
            s=$(stat -c %s "$2"); echo "$2 $s байт"; [ "$s" -lt 2147483000 ] || { echo "::warning::$2 больше 2 ГиБ — релиз не примет, пропускаю"; rm -f "$2"; }
          }
          dl "https://huggingface.co/Triangle104/Qwen2.5-3B-Instruct-abliterated-Q4_K_M-GGUF/resolve/main/qwen2.5-3b-instruct-abliterated-q4_k_m.gguf" qwen2.5-3b-instruct-abliterated-q4_k_m.gguf
          dl "https://huggingface.co/mav23/Qwen2.5-3B-Instruct-abliterated-GGUF/resolve/main/qwen2.5-3b-instruct-abliterated.Q3_K_M.gguf" qwen2.5-3b-instruct-abliterated.Q3_K_M.gguf
          dl "https://huggingface.co/mav23/Llama-3.2-3B-Instruct-abliterated-GGUF/resolve/main/llama-3.2-3b-instruct-abliterated.Q4_K_S.gguf" llama-3.2-3b-instruct-abliterated.Q4_K_S.gguf || true
          ls -la
          python3 - <<'EOF'
          import json, os, glob
          files = sorted(glob.glob('*.gguf'))
          json.dump({'tag': os.environ.get('TAG', 'v1'), 'files': [{'name': f, 'size': os.path.getsize(f)} for f in files]}, open('models.json', 'w'), ensure_ascii=False, indent=1)
          print(open('models.json').read())
          EOF
      - name: Релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          cd out
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Модели WaY $TAG" --notes "GGUF без цензуры для локального Мага. Скачиваются приложением WaY Рунология."
          for f in *.gguf models.json; do gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber; done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
